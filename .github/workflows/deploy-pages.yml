name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site files
        run: |
          set -euo pipefail
          test -f index.html
          test -f xy-synth.html

          mkdir -p site
          cp index.html site/index.html
          cp xy-synth.html site/xy-synth.html

          find . -type f \( \
            -name '*.css' -o -name '*.js' -o -name '*.mjs' -o -name '*.json' -o \
            -name '*.svg' -o -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o \
            -name '*.gif' -o -name '*.webp' -o -name '*.ico' -o -name '*.wav' -o \
            -name '*.mp3' -o -name '*.ogg' -o -name '*.wasm' -o -name '*.txt' -o \
            -name '*.xml' -o -name '*.webmanifest' -o -name '.nojekyll' -o -name 'CNAME' \
          \) \
          ! -path './.git/*' ! -path './.github/*' ! -path './site/*' \
          ! -name 'index.html' ! -name 'xy-synth.html' \
          -print0 | while IFS= read -r -d '' file; do
            target="site/${file#./}"
            mkdir -p "$(dirname "$target")"
            cp "$file" "$target"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
